# Builds the emulator on GitHub's Windows runner with Skylake flags. UNTESTED: see README-9400F.md.
# Put this file in .github/workflows/ of YOUR FORK of the selevet-eglantine repo, then run it from the Actions tab.
name: build-windows-9400f
on:
  workflow_dispatch:
    inputs:
      llvm_version:
        description: "LLVM/Clang version to download. The bundled profile needs the same Clang major version it was made with (23.x)."
        default: "23.1.2"
      use_pgo:
        description: "Use the bundled profile (true), or build without it (false) if Clang 23 can't be installed."
        default: "true"
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install LLVM, Ninja
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          choco install ninja -y --no-progress
          if ("${{ inputs.use_pgo }}" -eq "false") {
            echo "USE_PGO=0" >> $env:GITHUB_ENV
            echo "LLVM_ROOT=C:/Program Files/LLVM" >> $env:GITHUB_ENV   # runner's preinstalled LLVM
          } else {
            $v = "${{ inputs.llvm_version }}"
            $assets = gh release view "llvmorg-$v" --repo llvm/llvm-project --json assets --jq '.assets[].name'
            if ($LASTEXITCODE -ne 0) { throw "No LLVM release llvmorg-$v found. Pick another llvm_version." }
            echo "Release assets:"; echo $assets
            $tar = $assets | Where-Object { $_ -match '^clang\+llvm-.*x86_64-pc-windows-msvc\.tar\.xz$' } | Select-Object -First 1
            $msi = $assets | Where-Object { $_ -match '^LLVM-.*win64\.msi$' } | Select-Object -First 1
            if ($tar) {
              gh release download "llvmorg-$v" --repo llvm/llvm-project --pattern $tar
              tar -xf $tar -C C:\
              Move-Item "C:\$($tar -replace '\.tar\.xz$','')" C:\LLVM23
              $root = "C:\LLVM23"
            } elseif ($msi) {
              gh release download "llvmorg-$v" --repo llvm/llvm-project --pattern $msi
              Start-Process msiexec -ArgumentList "/i",$msi,"/qn","/norestart" -Wait
              $root = "C:\Program Files\LLVM"
            } else {
              throw "No Windows x64 LLVM package in release $v. See the asset list above."
            }
            $ver = & "$root\bin\clang-cl.exe" --version | Select-Object -First 1
            echo $ver
            if ($ver -notmatch "version 23") { throw "Expected Clang 23, got: $ver" }
            echo "LLVM_ROOT=$($root -replace '\\','/')" >> $env:GITHUB_ENV
            echo "$root\bin" >> $env:GITHUB_PATH
          }
          echo "C:\Program Files\Git\usr\bin" >> $env:GITHUB_PATH   # provides 'patch'
      - name: Install Vulkan SDK (glslangValidator)
        shell: pwsh
        run: |
          choco install vulkan-sdk -y --no-progress
          $sdk = (Get-ChildItem "C:\VulkanSDK" -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName
          echo "$sdk\Bin" >> $env:GITHUB_PATH
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Check tools
        shell: pwsh
        run: |
          clang-cl --version
          glslangValidator --version
          patch --version
      - name: Configure
        shell: pwsh
        run: cmake -C tuned/pgo-use-cache-9400f.cmake -S . -B build/pgo-use -G Ninja
      - name: Build
        shell: pwsh
        run: cmake --build build/pgo-use --target yuzu
      - name: Collect output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item build/pgo-use/bin/* out/ -Recurse -Force
          Copy-Item tuned/nx2_switches-9400f.txt out/nx2_switches.txt
      - uses: actions/upload-artifact@v4
        with:
          name: eglantine-9400f
          path: out
